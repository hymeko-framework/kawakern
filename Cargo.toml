[package]
name = "kawakern"
version = "0.1.0"
edition = "2024"
description = "Physics over HyMeKo kinematic models: articulated-body dynamics, contact, the stepping engine with attachments, energy audit and hydraulic muscles, force fields and vehicles. No IR."
license = "MIT OR Apache-2.0"

# The same published revisions transformation's hymeko_geometry pins, so a consumer of both
# resolves one crate identity per dependency.
[dependencies]
# The kinematic model, forward kinematics and collision geometry this engine steps.
hymeko_kinematics = { git = "ssh://git@192.168.1.228:2222/hymeko/geometry.git", rev = "2956f25aea5b52f645839fe75d54ca37fc7bfec1" }
# SE(n) rigid motions: the Tensor pillar's geometric algebra.
hymeko_clifford = { git = "ssh://git@192.168.1.228:2222/hymeko/tensor.git", rev = "9317ecf773d55a0e7968273a63bc2f4e8dbcc7c7" }
# Dense f64 kernels, re-exported by contact::replay as `dense`.
hymeko_tensor = { git = "ssh://git@192.168.1.228:2222/hymeko/tensor.git", rev = "d9a8a79f7152fdede8791c0bea5918eba0c3fab9" }
# Spatial candidate search for contact partitioning belongs to Graph SBSH.
hymeko_sbsh = { git = "ssh://git@192.168.1.228:2222/hymeko/graph.git", rev = "ea1c588697dd07412bc008a4a41813db8969a83e" }
serde = { version = "1", features = ["derive", "rc"] }
