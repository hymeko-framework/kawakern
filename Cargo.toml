[workspace]
members = [".", "kawakern_dynamics"]
resolver = "3"

[package]
name = "kawakern"
version = "0.1.0"
edition = "2024"
description = "Physics over HyMeKo kinematic models: articulated-body dynamics, contact, the stepping engine with attachments, energy audit and hydraulic muscles, force fields and vehicles. No IR."
license = "MIT"

# The public revisions every framework consumer pins, so a workspace that uses several of them
# resolves one crate identity per dependency.
[dependencies]
# The kinematic model, forward kinematics and collision geometry this engine steps.
hymeko_kinematics = { git = "https://github.com/hymeko-framework/geometry.git", rev = "f9b166d83ef8f4c0dcc9077179b7a920978e542e" }
# SE(n) rigid motions: the Tensor pillar's geometric algebra.
hymeko_clifford = { git = "https://github.com/hymeko-framework/tensor.git", rev = "2b0c18523e977d36691af2738bb8f4feabd8dc4b" }
# Dense f64 kernels, re-exported by contact::replay as `dense`.
hymeko_tensor = { git = "https://github.com/hymeko-framework/tensor.git", rev = "2b0c18523e977d36691af2738bb8f4feabd8dc4b" }
# Spatial candidate search for contact partitioning belongs to Graph SBSH.
hymeko_sbsh = { git = "https://github.com/hymeko-framework/graph.git", rev = "31f0bfaf2d008fdd15399ec83457b7b54f61b23d" }
# Rational spline evaluation for road centrelines (the revision hymeko_kinematics pins).
hymeko_spline = { git = "https://github.com/hymeko-framework/tensor.git", rev = "2b0c18523e977d36691af2738bb8f4feabd8dc4b" }
serde = { version = "1", features = ["derive", "rc"] }
