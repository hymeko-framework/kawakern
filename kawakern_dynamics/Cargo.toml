[package]
name = "kawakern_dynamics"
version = "0.1.0"
edition = "2024"
description = "HyMeKo IR read as a port-Hamiltonian system: projection, modal analysis, Kirchhoff laws, runs, fluid, diffusion, soft bodies, power views and discrete scenarios"
license = "MIT"

[[bin]]
name = "kawakern-dynamics"
path = "src/bin/dynamics.rs"

[features]
default = []
# The browser surface. Off by default: analysing a system has no business depending on wasm-bindgen.
web = ["dep:wasm-bindgen"]

# The public revisions every framework consumer pins, so a workspace that uses several of them
# resolves one crate identity per dependency.
[dependencies]
hymeko_core = { git = "https://github.com/hymeko-framework/core.git", rev = "957cf76a19989c077ee5a10b283f5382441b8f08" }
# The Tensor pillar's numerics.
hymeko_numerics = { git = "https://github.com/hymeko-framework/tensor.git", rev = "2b0c18523e977d36691af2738bb8f4feabd8dc4b" }
hymeko_graph = { git = "https://github.com/hymeko-framework/graph.git", rev = "31f0bfaf2d008fdd15399ec83457b7b54f61b23d" }
# The mechanism model and the engine whose power the views read.
hymeko_kinematics = { git = "https://github.com/hymeko-framework/geometry.git", rev = "f9b166d83ef8f4c0dcc9077179b7a920978e542e" }
kawakern = { path = ".." }
wasm-bindgen = { version = "0.2.127", optional = true }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2.2"
