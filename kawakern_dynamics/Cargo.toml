[package]
name = "kawakern_dynamics"
version = "0.1.0"
edition = "2024"
description = "HyMeKo IR read as a port-Hamiltonian system: projection, modal analysis, Kirchhoff laws, runs, fluid, diffusion, soft bodies, power views and discrete scenarios"
license = "MIT OR Apache-2.0"

[[bin]]
name = "kawakern-dynamics"
path = "src/bin/dynamics.rs"

[features]
default = []
# The browser surface. Off by default: analysing a system has no business depending on wasm-bindgen.
web = ["dep:wasm-bindgen"]

# The same published revisions transformation pins, so a consumer of both resolves one crate
# identity per dependency.
[dependencies]
hymeko_core = { git = "ssh://git@192.168.1.228:2222/hymeko/core.git", rev = "9f533ca8f9cd39806d8db9a0a68cda7932c81ae2" }
# The Tensor pillar's numerics.
hymeko_numerics = { git = "ssh://git@192.168.1.228:2222/hymeko/tensor.git", rev = "9317ecf773d55a0e7968273a63bc2f4e8dbcc7c7" }
hymeko_graph = { git = "ssh://git@192.168.1.228:2222/hymeko/graph.git", rev = "ea1c588697dd07412bc008a4a41813db8969a83e" }
# The in-memory SourceProvider, so a model compiles where there is no disk. Its own documentation
# places it beside Core's StdFsProvider; until it moves there it is consumed from transformation.
hymeko_sources = { git = "ssh://git@192.168.1.228:2222/hymeko/transformation.git", rev = "7d2232fcd26ac4b4479e946626895c808a119fed" }
# The mechanism model and the engine whose power the views read.
hymeko_kinematics = { git = "ssh://git@192.168.1.228:2222/hymeko/geometry.git", rev = "2956f25aea5b52f645839fe75d54ca37fc7bfec1" }
kawakern = { path = ".." }
wasm-bindgen = { version = "0.2.127", optional = true }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2.2"

[dev-dependencies]
# The network reading of the same circuit, so the quasi-static limit can be checked against it.
hymeko_optimize = { git = "ssh://git@192.168.1.228:2222/hymeko/transformation.git", rev = "7d2232fcd26ac4b4479e946626895c808a119fed" }
